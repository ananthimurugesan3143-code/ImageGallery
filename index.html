<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IamgeGallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <button class="prev">&#10094;</button>
    <img class="lightbox-img" id="lightbox-img">
    <button class="next">&#10095;</button>
</div>
<body>
    <h1>Image Gallery</h1>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn active" data-filter="nature">Nature</button>
        <button class="filter-btn active" data-filter="animals">Animals</button>

    </div>

    <div class="gallery">
        <img src="images/img1.jpg" alt="Forest" data-category="nature">
        <img src="images/img2.jpg" alt="Beach" data-category="nature">
        <img src="images/img3.jpg" alt="Mountain" data-category="nature">
        <img src="images/img4.jpg" alt="Sunset" data-category="nature">
        <img src="images/img5.jpg" alt="Rabbit" data-category="animals">
        <img src="images/img6.jpg" alt="Flowers" data-category="nature">
    </div>

    <script src="script.js"></script>
</body>
</html>
